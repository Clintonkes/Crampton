version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=sqlite:////app/crampton_lawncare.db
    volumes:
      - ./data:/app/data

# Frontend is deployed separately to GitHub Pages (see .github/workflows/frontend.yml).
# For local frontend dev, run `npm run dev` in ./frontend — vite.config.ts already
# proxies /api to http://localhost:8000.